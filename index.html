<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top and Bottom Braces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#3a2f45;--accent:#ec4f9a;--accent-deep:#c8337c;--glow:rgba(236,79,154,.45);--paper:#f6f4f8}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.app{overflow:hidden}
body{background:var(--paper);font-family:"Fredoka","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:-80px;opacity:0;transition:opacity .9s ease;pointer-events:none;background-size:cover;background-position:center;filter:blur(70px) brightness(1.04)}
.bg.on{opacity:1}
.app{position:relative;height:100%;display:grid;grid-template-rows:var(--top) 1fr var(--foot);align-items:center;justify-items:center;
  --top:88px;--foot:120px}
.top{position:absolute;top:0;right:0;padding:18px 20px 0;z-index:5}
.cart{position:relative;width:64px;height:64px;border-radius:22px;border:0;cursor:pointer;
  background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 6px 22px rgba(58,47,69,.14),inset 0 0 0 1.5px rgba(255,255,255,.9);
  display:grid;place-items:center;color:var(--ink);transition:transform .2s ease,box-shadow .25s ease,background .25s}
.cart:hover{transform:translateY(-2px) scale(1.05);background:#fff;box-shadow:0 10px 28px rgba(58,47,69,.2)}
.cart:active{transform:scale(.92)}
.cart:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.cart svg{width:32px;height:32px}
.badge{position:absolute;top:-7px;right:-7px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;
  background:var(--accent);color:#fff;font-weight:600;font-size:15px;line-height:26px;text-align:center;
  box-shadow:0 3px 10px var(--glow);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .5s}
.badge.show{transform:scale(1)}
.badge.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
.dots{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);animation:dotin .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes dotin{from{transform:scale(0)}to{transform:scale(1)}}
.cart.bump{animation:bump .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.22) rotate(-6deg)}60%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1)}}
.cart.wiggle{animation:wiggle .45s ease}
@keyframes wiggle{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
.cart.ready{animation:ready 1.6s ease-in-out infinite}
.cart.ready::before{content:"";position:absolute;inset:-6px;border-radius:27px;z-index:-1;
  background:conic-gradient(#ec4f9a,#2f9be6,#34b84a,#e5262c,#2b2833,#ec4f9a);filter:blur(6px);opacity:.8;animation:spin 3s linear infinite}
@keyframes ready{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes spin{to{transform:rotate(360deg)}}

.stage{grid-row:2;position:relative;aspect-ratio:1174/850;
  width:min(94vw,780px,calc((100vh - var(--top) - var(--foot) - 16px) * 1.381));
  width:min(94vw,780px,calc((100dvh - var(--top) - var(--foot) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 16px) * 1.381))}
.slide{position:absolute;inset:0;
  --fx:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);--fy:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent);
  -webkit-mask-image:var(--fx),var(--fy);-webkit-mask-composite:source-in;mask-image:var(--fx),var(--fy);mask-composite:intersect}
.slide img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.slide.float img{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.foot{grid-row:3;padding:0 20px 14px;display:grid;place-items:center}
.add{position:relative;overflow:hidden;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:22px;letter-spacing:.01em;
  color:#fff;padding:18px 46px;border-radius:999px;
  background:linear-gradient(180deg,var(--accent),var(--accent-deep));
  box-shadow:0 10px 26px var(--glow),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.12);
  transition:transform .18s ease,box-shadow .25s ease,background .5s,opacity .3s}
.add:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 16px 34px var(--glow),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.12)}
.add:active{transform:translateY(1px) scale(.95);box-shadow:0 4px 12px var(--glow),inset 0 3px 6px rgba(0,0,0,.2)}
.add:focus-visible{outline:3px solid #fff;outline-offset:4px;box-shadow:0 0 0 7px var(--accent),0 10px 26px var(--glow)}
.add:disabled{pointer-events:none}
.add.gone{transform:scale(0);opacity:0}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

.fly{position:fixed;z-index:20;pointer-events:none;border-radius:50%;
  -webkit-mask-image:radial-gradient(closest-side,#000 60%,transparent 100%);mask-image:radial-gradient(closest-side,#000 60%,transparent 100%)}

.final{position:fixed;inset:0;z-index:30;display:grid;place-items:center;visibility:hidden;opacity:0;transition:opacity .6s ease;cursor:pointer;
  background:radial-gradient(60% 50% at 20% 15%,#fbd3e6 0%,transparent 70%),radial-gradient(55% 45% at 85% 20%,#cfe6fd 0%,transparent 70%),
  radial-gradient(55% 50% at 15% 90%,#d3f2d9 0%,transparent 70%),radial-gradient(55% 50% at 88% 88%,#fbd0d4 0%,transparent 70%),#f3eef7}
.final.open{visibility:visible;opacity:1}
.final canvas{position:absolute;inset:0;width:100%;height:100%}
.boxwrap{position:relative;z-index:2;width:min(88vmin,720px);aspect-ratio:1;transform:scale(.3) rotate(-12deg);opacity:0}
.final.open .boxwrap{animation:boxin 1s cubic-bezier(.25,1.5,.45,1) .25s forwards}
.boxwrap img{width:100%;height:100%;display:block;filter:drop-shadow(0 30px 40px rgba(58,47,69,.22))}
@keyframes boxin{0%{transform:scale(.3) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.final canvas.front{z-index:3;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .slide.float img,.cart.ready,.cart.ready::before{animation:none}
}
@media (max-width:520px){.app{--top:84px;--foot:104px}.add{font-size:19px;padding:16px 38px}.cart{width:56px;height:56px}.top{padding:14px 14px 0}}
@media (max-height:520px) and (orientation:landscape){.app{--top:12px;--foot:84px}.add{font-size:18px;padding:13px 34px}.cart{width:52px;height:52px}.top{padding:12px 14px 0}}
@media (max-height:520px){.boxwrap{width:min(96vmin,720px)}}
</style>
</head>
<body>
<div id="bgs"></div>
<main class="app">
  <div class="top">
    <button class="cart" id="cart" aria-label="Box">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11.5 16 6l12 5.5"/><path d="M4 11.5v11L16 28l12-5.5v-11"/><path d="M4 11.5 16 17l12-5.5"/><path d="M16 17v11"/>
      </svg>
      <span class="badge" id="badge">0</span>
      <span class="dots" id="dots"></span>
    </button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="foot"><button class="add" id="add">Add to box</button></div>
</main>
<div class="final" id="final" aria-hidden="true">
  <canvas id="back"></canvas>
  <div class="boxwrap"><img id="boximg" alt="Top and Bottom Braces"></div>
  <canvas id="front" class="front"></canvas>
</div>

const ITEMS=[
 {img:IMG[0],a:'#ec4f9a',d:'#c8337c',g:'rgba(236,79,154,.45)',bg:['#d3e3fc','#fbedea','#f6bad0','#fde2ee']},
 {img:IMG[1],a:'#2f9be6',d:'#1a76c2',g:'rgba(47,155,230,.45)',bg:['#c5e0fd','#c8edf1','#b3cef3','#ddddfd']},
 {img:IMG[2],a:'#e5262c',d:'#b5151b',g:'rgba(229,38,44,.42)',bg:['#e6e2f5','#fbdcda','#ef9da9','#e2e2fa']},
 {img:IMG[3],a:'#34b84a',d:'#21913a',g:'rgba(52,184,74,.42)',bg:['#ccede2','#d7edee','#b1e4be','#deeef9']},
 {img:IMG[4],a:'#3b3644',d:'#1f1b26',g:'rgba(43,40,51,.4)',bg:['#c0bdd2','#cac6d6','#9d96a9','#d8d3e5']}
];
const $=s=>document.querySelector(s);
const stage=$('#stage'),addBtn=$('#add'),cart=$('#cart'),badge=$('#badge'),dots=$('#dots'),bgs=$('#bgs'),root=document.documentElement;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let idx=0,count=0,busy=false;

ITEMS.forEach((it,i)=>{const b=document.createElement('div');b.className='bg';
  b.style.backgroundColor=it.bg[3];b.style.backgroundImage=`url(${it.img})`;
  bgs.appendChild(b)});
function theme(i){const it=ITEMS[i];root.style.setProperty('--accent',it.a);root.style.setProperty('--accent-deep',it.d);root.style.setProperty('--glow',it.g);
  [...bgs.children].forEach((b,j)=>b.classList.toggle('on',j===i))}
function showSlide(i,first){
  const s=document.createElement('div');s.className='slide float';
  const im=new Image();im.src=ITEMS[i].img;im.alt='';s.appendChild(im);stage.appendChild(s);theme(i);
  if(!first&&!reduce)s.animate([{transform:'translateX(60%) rotate(8deg) scale(.7)',opacity:0},{transform:'none',opacity:1}],{duration:650,easing:'cubic-bezier(.2,1.2,.4,1)'});
  return s}
let current=showSlide(0,true);

addBtn.addEventListener('click',e=>{
  if(busy)return;busy=true;
  const r=addBtn.getBoundingClientRect(),rp=document.createElement('span'),sz=Math.max(r.width,r.height);
  rp.className='ripple';rp.style.cssText=`width:${sz}px;height:${sz}px;left:${e.clientX-r.left-sz/2}px;top:${e.clientY-r.top-sz/2}px`;
  addBtn.appendChild(rp);setTimeout(()=>rp.remove(),650);
  const sr=stage.getBoundingClientRect(),cr=cart.getBoundingClientRect();
  const fly=new Image();fly.src=ITEMS[idx].img;fly.className='fly';
  fly.style.cssText=`left:${sr.left}px;top:${sr.top}px;width:${sr.width}px;height:${sr.height}px`;document.body.appendChild(fly);
  current.remove();
  const dx=cr.left+cr.width/2-(sr.left+sr.width/2),dy=cr.top+cr.height/2-(sr.top+sr.height/2),k=cr.width/sr.width;
  const anim=fly.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},
    {transform:`translate(${dx*.45}px,${dy*.2-60}px) scale(.5) rotate(-14deg)`,opacity:1,offset:.45},
    {transform:`translate(${dx}px,${dy}px) scale(${k*.6}) rotate(-30deg)`,opacity:.3}],
    {duration:reduce?250:800,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});
  const col=ITEMS[idx].a;
  anim.onfinish=()=>{fly.remove();count++;
    badge.textContent=count;badge.classList.add('show');badge.classList.remove('pop');void badge.offsetWidth;badge.classList.add('pop');
    const d=document.createElement('i');d.style.background=col;dots.appendChild(d);
    cart.classList.remove('bump');void cart.offsetWidth;cart.classList.add('bump');
    sparks(cr.left+cr.width/2,cr.top+cr.height/2,col);
    idx++;
    if(idx<ITEMS.length){current=showSlide(idx);busy=false}
    else{addBtn.classList.add('gone');addBtn.disabled=true;setTimeout(()=>{cart.classList.remove('bump');cart.classList.add('ready')},500)}
  };
});

cart.addEventListener('click',()=>{
  if(count<ITEMS.length){cart.classList.remove('wiggle','bump');void cart.offsetWidth;cart.classList.add('wiggle');return}
  openFinal()});

/* small sparks at cart */
function sparks(x,y,c){for(let i=0;i<10;i++){const p=document.createElement('span');
  p.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:7px;height:7px;border-radius:50%;background:${c};z-index:25;pointer-events:none`;
  document.body.appendChild(p);const a=Math.random()*Math.PI*2,dd=30+Math.random()*30;
  p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*dd-3}px,${Math.sin(a)*dd-3}px) scale(0)`,opacity:0}],{duration:550,easing:'ease-out'}).onfinish=()=>p.remove()}}

/* ---------- celebration ---------- */
const final=$('#final'),back=$('#back'),front=$('#front');$('#boximg').src=IMG[5];
const PAL=['#ec4f9a','#2f9be6','#e5262c','#34b84a','#3b3644','#ffc94d','#ff8fc6','#7fd0ff'];
let W,H,DPR,bx,fx,parts=[],rockets=[],running=false,t0=0;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  [back,front].forEach(c=>{c.width=W*DPR;c.height=H*DPR});bx=back.getContext('2d');fx=front.getContext('2d');bx.setTransform(DPR,0,0,DPR,0,0);fx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
function confettiBurst(x,y,n,spread,power,dirA){for(let i=0;i<n;i++){const a=dirA+rnd(-spread,spread),v=rnd(power*.5,power);
  parts.push({k:'c',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:rnd(7,13),h:rnd(4,8),r:rnd(0,6.28),vr:rnd(-.3,.3),c:pick(PAL),life:rnd(220,340),t:0,wob:rnd(0,6.28),shape:Math.random()<.25?1:0,front:Math.random()<.45})}}
function rain(n){for(let i=0;i<n;i++)parts.push({k:'c',x:rnd(0,W),y:rnd(-60,-10),vx:rnd(-1,1),vy:rnd(1,3),w:rnd(7,12),h:rnd(4,7),r:rnd(0,6.28),vr:rnd(-.2,.2),c:pick(PAL),life:500,t:0,wob:rnd(0,6.28),shape:Math.random()<.25?1:0,front:Math.random()<.4})}
function rocket(){rockets.push({x:rnd(W*.1,W*.9),y:H+10,vx:rnd(-1,1),vy:-rnd(H*.016,H*.021)-6,c:pick(PAL),trail:[]})}
function explode(x,y,c){const n=60+(Math.random()*40|0),c2=pick(PAL);
  for(let i=0;i<n;i++){const a=i/n*6.283+rnd(-.05,.05),v=rnd(2,6.5);
    parts.push({k:'f',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:Math.random()<.7?c:c2,life:rnd(60,95),t:0,s:rnd(1.6,2.8)})}
  for(let i=0;i<14;i++)parts.push({k:'f',x,y,vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5),c:'#fff6c8',life:40,t:0,s:3})}
function loop(ts){if(!running)return;const el=(ts-t0)/1000;
  bx.globalCompositeOperation='source-over';bx.clearRect(0,0,W,H);fx.clearRect(0,0,W,H);
  if(el<10&&Math.random()<(el<4?.07:.035))rocket();
  else if(el>=10&&Math.random()<.012)rocket();
  if(Math.random()<(el<6?.5:.15))rain(1);
  rockets=rockets.filter(r=>{r.trail.push([r.x,r.y]);if(r.trail.length>6)r.trail.shift();r.x+=r.vx;r.y+=r.vy;r.vy+=.18;
    bx.strokeStyle=r.c;bx.lineWidth=2.5;bx.lineCap='round';bx.beginPath();r.trail.forEach(([x,y],i)=>i?bx.lineTo(x,y):bx.moveTo(x,y));bx.stroke();
    if(r.vy>=-1.5){explode(r.x,r.y,r.c);return false}return true});
  parts=parts.filter(p=>{p.t++;
    if(p.k==='c'){p.vx*=.985;p.vy=p.vy*.985+.12;p.wob+=.1;p.x+=p.vx+Math.sin(p.wob)*.8;p.y+=p.vy;p.r+=p.vr;
      const ctx=p.front?fx:bx,a=Math.min(1,(p.life-p.t)/40);ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(1,Math.cos(p.wob*1.3));ctx.fillStyle=p.c;
      if(p.shape){ctx.beginPath();ctx.arc(0,0,p.h*.7,0,6.283);ctx.fill()}else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
      return p.t<p.life&&p.y<H+40}
    p.vx*=.96;p.vy=p.vy*.96+.06;p.x+=p.vx;p.y+=p.vy;const a=1-p.t/p.life;
    bx.globalAlpha=a;bx.fillStyle=p.c;bx.beginPath();bx.arc(p.x,p.y,p.s*(.6+a*.6),0,6.283);bx.fill();bx.globalAlpha=1;return p.t<p.life});
  requestAnimationFrame(loop)}
function openFinal(){final.classList.add('open');final.setAttribute('aria-hidden','false');size();running=true;
  requestAnimationFrame(ts=>{t0=ts;
    const n=reduce?40:160;
    confettiBurst(0,H*.85,n,.5,22,-Math.PI/3);confettiBurst(W,H*.85,n,.5,22,-Math.PI*2/3);
    setTimeout(()=>confettiBurst(W/2,H*.55,n,Math.PI,16,-Math.PI/2),450);
    for(let i=0;i<4;i++)setTimeout(rocket,i*180);
    loop(ts)})}
final.addEventListener('click',e=>{confettiBurst(e.clientX,e.clientY,70,Math.PI,13,-Math.PI/2);explode(e.clientX,e.clientY,pick(PAL))});
</script>
